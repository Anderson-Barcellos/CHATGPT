# Gaúcho Chat — Next.js em produção, chatgpt.service, 127.0.0.1:3040, basePath=/chat.
# Instalado por deploy/install.sh em /etc/apache2/snippets/chat.conf.
# Ativar, uma vez por host, dentro do <VirtualHost *:443> do domínio:
#     Include snippets/chat.conf
# depois: apache2ctl configtest && systemctl reload apache2. Registrar em /etc/apache2/APACHE.md.
# Portado do bloco do vhost ultrassom.ai-optimized.conf (host velho), com o host dinâmico.
# Auth JWT (cookie) é da aplicação; Apache é só reverse-proxy. Requer mod_proxy, mod_proxy_http, mod_headers.
ProxyPass        /chat/api/ http://127.0.0.1:3040/chat/api/
ProxyPassReverse /chat/api/ http://127.0.0.1:3040/chat/api/
ProxyPass        /chat/api http://127.0.0.1:3040/chat/api
ProxyPassReverse /chat/api http://127.0.0.1:3040/chat/api
ProxyPass        /chat http://127.0.0.1:3040/chat
ProxyPassReverse /chat http://127.0.0.1:3040/chat

<Location /chat>
    # CookiePath escopado AQUI (não no vhost!) — solto, reescrevia Path=/ de TODOS
    # os proxies do site (quebrou o sonaris_resource do /laudos-api em 2026-07).
    ProxyPassReverseCookiePath / /chat
    # Alinha a CSP do Apache à política do Next. O Studio e o Monaco usam
    # Workers locais em blob:; manter este override escopado ao /chat evita
    # que políticas conflitantes bloqueiem o runner no navegador.
    Header always unset Content-Security-Policy
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://api.openai.com https://vercel.live wss:; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Require all granted
    Header always set X-Forwarded-SSL on
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}i"
</Location>
