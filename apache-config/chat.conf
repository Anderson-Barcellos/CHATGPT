# Configuração do Apache para ChatGPT Clone no /chat
# Adicionar ao arquivo /etc/apache2/sites-available/ultrassom.ai-optimized.conf

# ChatGPT Clone - Gaúcho Chat
<Location /chat>
    ProxyPass http://localhost:3040/chat
    ProxyPassReverse http://localhost:3040/chat
    ProxyPreserveHost On
    
    # Headers para Next.js
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "ultrassom.ai"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    
    # Timeout para streaming (respostas longas)
    ProxyTimeout 120
</Location>

# API routes
<Location /chat/api>
    ProxyPass http://localhost:3040/chat/api
    ProxyPassReverse http://localhost:3040/chat/api
    ProxyPreserveHost On
    
    # Headers para API
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "ultrassom.ai"
    
    # Timeout maior para APIs de IA
    ProxyTimeout 300
</Location>

# Static files (_next)
<Location /chat/_next>
    ProxyPass http://localhost:3040/chat/_next
    ProxyPassReverse http://localhost:3040/chat/_next
    ProxyPreserveHost On
    
    # Cache para assets estáticos
    Header set Cache-Control "public, max-age=31536000, immutable"
</Location>

# WebSocket para Hot Module Replacement (desenvolvimento)
<Location /chat/_next/webpack-hmr>
    ProxyPass ws://localhost:3040/chat/_next/webpack-hmr
    ProxyPassReverse ws://localhost:3040/chat/_next/webpack-hmr
</Location>

# Imagens e outros assets
<Location /chat/images>
    ProxyPass http://localhost:3040/chat/images
    ProxyPassReverse http://localhost:3040/chat/images
    Header set Cache-Control "public, max-age=86400"
</Location>

<Location /chat/favicon.ico>
    ProxyPass http://localhost:3040/chat/favicon.ico
    ProxyPassReverse http://localhost:3040/chat/favicon.ico
    Header set Cache-Control "public, max-age=86400"
</Location>